# Local development: Postgres plus the server, with emails and codes printed to the server log.
#   docker compose up --build        then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aknologia
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  server:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/aknologia?sslmode=disable
      APP_SECRET: local-dev-secret
      PUBLIC_URL: http://localhost:8080
      DEV_MODE: "true"
volumes:
  pgdata:
